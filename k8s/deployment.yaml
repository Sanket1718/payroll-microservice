apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-app
  namespace: dev-environment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payroll
  template:
    metadata:
      labels:
        app: payroll
    spec:
      containers:
      - name: payroll-container
        image: ${IMAGE_NAME} # Jenkins will replace this dynamically
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
  namespace: dev-environment
spec:
  type: NodePort
  selector:
    app: payroll
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
